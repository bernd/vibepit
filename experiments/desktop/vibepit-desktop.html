function commit(result){scrollRemember();zoomedPane=null;layout=result;save();render();focusPane(active()?.focus)}
function applyMove(src,dest){try{commit(transform(src,dest));return true}catch(e){tell(e.message,true);return false}}
function mini(n,incoming,target){const d=el('div',n.children?'schematic groupmini '+n.dir:'leafmini',n.children?'':title(n));if(n.id===incoming)d.classList.add('incoming');if(n.id===target)d.classList.add('targetmark');if(n.children)n.children.forEach((c,i)=>{const x=mini(c,incoming,target);x.style.flex=n.weights[i]+' 1 0';d.append(x)});return d}

// The command palette lists every command with its chord and acts on the focused pane.
function palette(){
 const p=current(),t=active(),s=p&&sessions[p.sid],live=p?.type==='session'&&!!s&&!s.ended,parent=t&&p&&all(t.root).find(n=>n.children?.includes(p));
 const cmds=[
  ['New Session tab','newTab',act.newTab,online],['Split right','splitRight',act.splitRight,!!p],['Split below','splitBelow',act.splitBelow,!!p],
  [zoomedPane?'Restore layout':'Zoom pane','zoom',act.zoom,!!t?.root.children],['Close pane','close',act.close,!!p],
  ['Focus pane left','left',act.left,!!p&&!zoomedPane],['Focus pane right','right',act.right,!!p&&!zoomedPane],['Focus pane above','up',act.up,!!p&&!zoomedPane],['Focus pane below','down',act.down,!!p&&!zoomedPane],
  ['Next tab','nextTab',act.nextTab,tabs().length>1],['Previous tab','prevTab',act.prevTab,tabs().length>1],['Open hold list','holds',openHolds,true],
  ['Rename session…','',()=>renameSession(p),live],['Move pane…','',()=>moveDialog(p.id),!!p],['Move to new tab','',()=>applyMove(p.id,{gap:tabs().length}),!!p&&!!t.root.children],
  ['Equalize sizes','',()=>equalize(parent,t),!!parent],['Close tab','',()=>requestClose(t.root.id),!!t],['End session…','',()=>confirmEnd(p.sid),live],['Detach session','',()=>removeNode(p.id,'detach'),live],
  ['Attach session…','',detachedList,true],['Open Monitor','',()=>addTab('monitor'),true],['Open Logs','',()=>addTab('logs'),true],
  ['Send next key to terminal','',()=>{passNext=true;tell('The next key chord goes to the program in the focused pane.',true)},!!p],['Hide window','hide',act.hide,true]
 ].map(([name,id,run,ok])=>({name,chord:chords[id]||'',run,ok}));
 const b=modal('Commands'),input=el('input','wide'),box=el('div','cmdlist');let shown=[],index=0;
 input.placeholder='Type a command';input.autocomplete='off';input.spellcheck=false;input.setAttribute('role','combobox');input.setAttribute('aria-expanded','true');input.setAttribute('aria-controls','cmdlist');input.setAttribute('aria-label','Command');box.id='cmdlist';box.setAttribute('role','listbox');box.setAttribute('aria-label','Commands');
 function run(c){if(!c?.ok)return;dlg.close();c.run()}
 function draw(){
  const q=input.value.trim().toLowerCase();shown=cmds.filter(c=>c.name.toLowerCase().includes(q));index=Math.min(index,Math.max(0,shown.length-1));box.replaceChildren();
  shown.forEach((c,i)=>{const o=el('div','cmdrow'+(i===index?' on':''));o.id='cmd-'+i;o.setAttribute('role','option');o.setAttribute('aria-selected',String(i===index));if(!c.ok)o.setAttribute('aria-disabled','true');o.append(el('span','',c.name));if(c.chord)o.append(el('kbd','',c.chord));o.onclick=()=>run(c);box.append(o)});

 }
 input.oninput=()=>{index=0;draw()};
 input.onkeydown=e=>{if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();if(shown.length)index=(index+(e.key==='ArrowDown'?1:shown.length-1))%shown.length;draw()}else if(e.key==='Enter'){e.preventDefault();run(shown[index])}};
 b.append(input,box);draw();input.focus()
}
$('#commands').innerHTML='Commands <kbd>'+escapeText(chords.palette)+'</kbd>';$('#commands').onclick=palette;

const overlay=$('#projection');
function removeMarks(){document.querySelectorAll('.ins,.endins,.reveal').forEach(x=>x.classList.remove('ins','endins','reveal'));overlay.hidden=true;overlay.replaceChildren()}
function showDestination(dest,tabId){
 const sig=JSON.stringify([dest,tabId]);if(drag.sig===sig)return;drag.sig=sig;drag.result=null;removeMarks();
 if(tabId&&drag.reveal!==tabId){drag.reveal=tabId;render(tabId)}
 if(!dest)return;
 if('gap' in dest){const ns=[...$('#strip').children];(ns[dest.gap]||ns.at(-1))?.classList.add(dest.gap<ns.length?'ins':'endins');try{drag.result=transform(drag.src,dest)}catch{}return}
 const t=owner(dest.target);document.querySelector('[data-tab="'+t.id+'"]')?.classList.add('reveal');
 const rect=$('#stage').getBoundingClientRect();Object.assign(overlay.style,{left:(rect.left+8)+'px',top:(rect.top+8)+'px',width:(rect.width-16)+'px',height:(rect.height-16)+'px'});overlay.hidden=false;overlay.classList.remove('invalid');
 try{drag.result=transform(drag.src,dest);overlay.append(mini(drag.result.tabs.find(x=>x.id===drag.result.active).root,drag.src,dest.target))}catch(e){overlay.classList.add('invalid');overlay.textContent=e.message}
}
function closestEdge(rect,x,y){return [['left',(x-rect.left)/rect.width],['right',(rect.right-x)/rect.width],['top',(y-rect.top)/rect.height],['bottom',(rect.bottom-y)/rect.height]].sort((a,b)=>a[1]-b[1])[0][0]}
// A release outside the workspace and the tab bar has no destination, which cancels the move.
function hit(x,y){const at=document.elementFromPoint(x,y);if(!at){showDestination(null);return}const tab=at.closest('.tab'),bar=at.closest('.tabbar');
 if(tab){const i=tabs().findIndex(t=>t.id===tab.dataset.tab),t=tabs()[i],r=tab.getBoundingClientRect(),width=Math.min(17,r.width/5);if(x<r.left+width||x>r.right-width){showDestination({gap:i+(x>r.right-width?1:0)});return}if(t.root.id===drag.src){showDestination(null,t.id);return}showDestination({target:t.root.id,edge:'right'},t.id);return}
 if(bar){showDestination({gap:tabs().length});return}
 if(!at.closest('#stage')){showDestination(null);return}
 const t=tabs().find(t=>t.id===drag.reveal)||active(),r=$('#stage').getBoundingClientRect();if(!t)return;

let ignoreClickUntil=0;

},true);

// Chords are taken before a terminal sees them. Modified Enter, Tab and a lone Escape are left to the terminal.
document.addEventListener('keydown',e=>{

},true);
